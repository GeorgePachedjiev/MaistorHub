<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - MaistorHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🔧</span>
                    <span class="logo-text">MaistorHub</span>
                </div>
                <nav class="main-nav">
                    <a href="index.html" class="nav-link">Начало</a>
                    <a href="masters.html" class="nav-link">Майстори</a>
                    <a href="login.html" class="nav-link btn-nav active">Вход</a>
                    <a href="register.html" class="nav-link btn-nav">Регистрация</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="auth-main">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1 class="auth-title">Вход в системата</h1>
                        <p class="auth-subtitle">Влез в своя акаунт, за да управляваш профила си</p>
                    </div>

                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="email" class="form-label">Email <span class="required">*</span></label>
                            <input type="email" id="email" name="email" class="form-input" required placeholder="ivan@example.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">Парола <span class="required">*</span></label>
                            <input type="password" id="password" name="password" class="form-input" required placeholder="Въведи паролата си">
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block btn-large">
                            <span>Влез</span>
                        </button>
                    </form>
                    
                    <div class="auth-footer">
                        <p>Нямаш акаунт? <a href="register.html" class="auth-link">Регистрирай се тук</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <span class="logo-icon">🔧</span>
                    <span class="logo-text">MaistorHub</span>
                </div>
                <p class="footer-text">&copy; 2024 MaistorHub. Локален marketplace за майстори в Смолян.</p>
            </div>
        </div>
    </footer>

    <!-- Notification Toast -->
    <div id="notification" class="notification"></div>

    <script src="main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Влизане...</span>';
            
            const result = await loginMaster(formData);
            
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Влез</span>';
            
            if (result.success) {
                showNotification(`Добре дошли, ${result.data.name}!`, 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showNotification(result.error || 'Възникна грешка при влизането', 'error');
            }
        });
    </script>
</body>
</html>
